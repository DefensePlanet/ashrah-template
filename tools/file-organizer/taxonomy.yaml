# Custom Taxonomy for {{USER_NAME}}'s File Organizer
# Each category has:
#   label:            Display name (used in Finder tags)
#   color:            Finder color (red=1, green=2, yellow=3, blue=4, orange=5, purple=6, gray=7, none=0)
#   path_patterns:    Substrings matched against the full file path (case-insensitive)
#   content_keywords: Phrases searched inside file text/PDF content (case-insensitive)
#   description:      Helps the AI fallback understand this category
#   priority:         Higher = checked first (resolves ties)

categories:

  # ── Business Projects ──────────────────────────────────────

  example-team-tags:
    label: "Big Sky Tags"
    color: 4  # blue
    priority: 90
    path_patterns:
      - "big sky"
      - "big_sky"
      - "exampleteam"
      - "bst"
      - "exampleteamtagsholdings"
    content_keywords:
      - "big sky tags"
      - "big sky holdings"
      - "exampleteamtagsholdings"
      - "big sky team"
      - "livestock tag"
      - "cattle tag"
      - "ear tag"
      - "ranch tag"
    description: "Big Sky Tags — livestock tagging app/business, brand assets, app icons"

  rawhide-organics:
    label: "Rawhide Organics"
    color: 5  # orange
    priority: 90
    path_patterns:
      - "rawhide"
      - "rawhide-organics"
      - "rawhide_organics"
    content_keywords:
      - "rawhide organics"
      - "tallow balm"
      - "jackaroo"
      - "gold rush"
      - "beef tallow"
      - "tallow skincare"
      - "rawhide introductions"
      - "rawhide skin"
      - "western skincare"
    description: "Rawhide Organics — tallow-based skincare brand, product photos, labels, packaging"

  asset-labs:
