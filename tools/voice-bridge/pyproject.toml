[project]
name = "catalyst-voice"
version = "0.2.0"
description = "Catalyst Voice Bridge - Conversational AI with Mistral, Silero VAD, and Streaming TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # STT - Whisper (local, privacy-first)
    "faster-whisper>=1.2.1",

    # Audio processing
    "numpy>=2.2.6",
    "sounddevice>=0.5.5",

    # Pipecat framework (includes silero integration)
    "pipecat-ai[openai,silero]>=0.0.101",

    # Silero VAD for voice activity detection
    "silero-vad>=5.1.2",

    # PyTorch for Silero VAD
    "torch>=2.0.0",

    # HTTP client for Mistral API and Kokoro TTS
    "httpx>=0.27.0",

    # Mistral AI SDK (optional but preferred)
    "mistralai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
voice-bridge = "voice_bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
