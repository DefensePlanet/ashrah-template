[tool.poetry]
name = "ty-music-bridge"
version = "0.1.0"
description = "Two-way ISRC-first Apple Music ⇄ Spotify sync CLI"
authors = ["{{USER_NAME}}"]
readme = "README.md"
packages = [{include = "ty_music_bridge"}]

[tool.poetry.dependencies]
python = "^3.11"
spotipy = "2.25.2"
httpx = "0.28.1"
python-dotenv = "1.2.1"
pydantic = "2.12.5"
typer = {extras = ["all"], version = "0.20.0"}
rapidfuzz = "3.14.3"
tenacity = "9.1.2"
rich = "14.2.0"
pydantic-settings = "2.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.1"
pytest-cov = "4.1.0"
pytest-mock = "3.15.1"
black = "25.11.0"
ruff = "0.1.6"

[tool.poetry.scripts]
tymb = "ty_music_bridge.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]